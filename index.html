<script>
const M=JSON.parse(document.getElementById('model').textContent);
function predict(raw){let a=M.inputs.map(k=>{let x=+raw[k];const s=M.scaling[k];return s?(x-s.mean)/s.std:x});
for(const L of M.layers){const out=L.bias.map((b,j)=>{let z=b;for(let i=0;i<a.length;i++)z+=a[i]*L.weights[i][j];return L.activation==='relu'?Math.max(0,z):L.activation==='sigmoid'?1/(1+Math.exp(-z)):z});a=out}return a[0]}
const lines=document.getElementById('csv').textContent.trim().split('\n');const H=lines[0].split(',');
const rows=lines.slice(1).map(l=>{const v=l.split(',');const o={};H.forEach((h,i)=>o[h]=v[i]);return o});
rows.forEach(r=>r.p=predict(r));
const sorted=[...rows].sort((a,b)=>b.p-a.p);
function render(){const n=Math.max(1,Math.min(1000,+document.getElementById('n').value||100));const top=sorted.slice(0,n);const hit=top.filter(r=>r.accepted_loan==='1').length;
document.getElementById('summary').innerHTML=`<b>Calling the top ${n}</b> customers reaches <b>${hit}</b> who accepted (actual outcome), vs. about ${Math.round(n*rows.filter(r=>r.accepted_loan==='1').length/rows.length)} with random calls. Total accepters on the list: ${rows.filter(r=>r.accepted_loan==='1').length}.`;
let h='<table><tr><th>Rank</th><th>ID</th><th>Probability</th><th>Income</th><th>Education</th><th>Family</th><th>CCAvg</th><th>CD Account</th><th>Actually accepted</th></tr>';
top.forEach((r,i)=>h+=`<tr><td>${i+1}</td><td>${r.ID}</td><td>${(r.p*100).toFixed(1)}%</td><td>${r.Income}</td><td>${r.Education}</td><td>${r.Family}</td><td>${r.CCAvg}</td><td>${r['CD Account']}</td><td>${r.accepted_loan==='1'?'Yes':'No'}</td></tr>`);
document.getElementById('list').innerHTML=h+'</table>'}
const f=document.getElementById('f');const def={Age:40,Income:120,Family:3,CCAvg:2.5,Education:2,Mortgage:0,'Securities Account':0,'CD Account':0,Online:1,CreditCard:0};
M.inputs.forEach(k=>f.innerHTML+=`<div><label>${k}</label><input name="${k}" type="number" step="any" value="${def[k]}"></div>`);
function one(){const raw={};M.inputs.forEach(k=>raw[k]=f.elements[k].value);document.getElementById('res').innerHTML='Probability of accepting: <b>'+(predict(raw)*100).toFixed(2)+'%</b>'}
let maxd=0;rows.forEach(r=>maxd=Math.max(maxd,Math.abs(r.p-(+r.p_nn_reference))));
const pass=maxd<1e-5;window.CHECK={maxd,pass,n:rows.length};
document.getElementById('check').innerHTML=`<h2>Consistency check</h2>Recomputed ${rows.length} customers in the browser and compared with Python's p_nn_reference. Largest difference: ${maxd.toExponential(2)} — <span class="${pass?'ok':'bad'}">${pass?'PASS (below 0.00001)':'FAIL'}</span>`;
render();
</script></body></html>
